<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herren 1 · TSV Nordhain 1920</title>
  <!-- Ohne Build: alle Dateien liegen lokal im Projekt (kein CDN, kein unpkg). Die Ordner stammen aus dem Paket (hoops-sync.mjs / portal-sync.mjs):
       hoops/             dist/vanilla (hoops.css, hoops.min.js, hoops-render.min.js, hoops-map.min.js)
       vendor/leaflet/  Leaflet (leaflet.css, leaflet-src.esm.js), erst nach dem Klick auf "Karte laden" geladen
       Die Pfade sind relativ zur Seite: sie funktionieren auch auf einer GitHub-Pages-Projektseite unter /<repo>/ (ein Pfad mit führendem / täte es nicht). -->
  <link rel="stylesheet" href="hoops/hoops.css" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="portal.css" />
  <!-- Kachel-Adresse der Karte: ein eigener Proxy oder Kachelserver; der Host gehört in img-src der CSP -->
  <meta name="hoops-tile-url" content="/tiles/{z}/{x}/{y}.png" />
  <meta name="hoops-page" content="team" />
  <!-- Gegen Flackern im Dunkelmodus (Ergebnis von themeBootScript()); mit CSP braucht es einen Hash:
       script-src 'self' 'sha256-<Hash des Textes zwischen den Skript-Tags>' -->
  <script>(function(){var m;try{m=localStorage.getItem("hoops-theme")}catch(e){}if(m!=="light"&&m!=="dark"&&m!=="system")m="system";if(m==="light"||m==="dark")document.documentElement.setAttribute("data-theme",m)})();</script>
  <script type="module" src="portal.js"></script>
</head>
<body data-hoops="backtop">
  <a class="portal-skip" href="#inhalt">Zum Inhalt</a>
  <header class="portal-head">
    <p class="portal-brand">TSV Nordhain 1920</p>
    <nav class="portal-menu" aria-label="Hauptmenü"><a href="index.html">Verein</a> <a href="team.html" aria-current="page">Herren 1</a></nav>
    <div class="portal-tools">
      <!-- ohne JavaScript ohne Wirkung: bleibt verborgen, portal.js zeigt ihn -->
      <button type="button" class="hoops-btn hoops-btn--secondary hoops-btn--md" data-hoops-modal-open="fehler-melden" hidden>Fehler melden</button>
      <button type="button" class="hoops-btn hoops-btn--secondary hoops-btn--icon" data-hoops="theme" hidden></button>
    </div>
  </header>
  <main id="inhalt" class="portal-main" data-hoops="pagenav" data-hoops-options='{"label":"Auf dieser Seite"}'>
    <h1>Herren 1</h1>
    <p class="portal-intro" id="intro"></p>
    <noscript><p class="portal-noscript">Diese Seite baut Tabellen, Spielplan und Karte mit JavaScript aus den Daten auf. Bitte aktiviere JavaScript, um sie zu sehen.</p></noscript>
    <div id="inhalt-dynamisch" class="portal-stack"></div>
  </main>
  <footer class="portal-foot">
    <p>Demo-Seite des HoopsFoundry UIs. Alle Daten sind erfunden.</p>
  </footer>
  <div id="dialoge"></div>
</body>
</html>
