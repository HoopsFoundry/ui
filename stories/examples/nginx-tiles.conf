# Beispiel (nicht Teil des Pakets): Kachel-Proxy mit Zwischenspeicher für OpenStreetMap-Kacheln.
# Datei z. B. /etc/nginx/conf.d/tiles.conf (liegt im http-Block). Aufruf aus der Karte: tileUrl="/tiles/{z}/{x}/{y}.png".

# Zwischenspeicher: 2 GB, Einträge nach 14 Tagen ohne Abruf entfernen
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=osm_tiles:20m max_size=2g inactive=14d use_temp_path=off;
# Schutz vor Massenabrufen (pro Besucher-IP 20 Anfragen je Sekunde)
limit_req_zone $binary_remote_addr zone=tiles:10m rate=20r/s;

server {
    listen 443 ssl;
    server_name beispiel.example;
    # ssl_certificate und ssl_certificate_key wie bei der übrigen Seite

    # Nur Kachelpfade: Ziel z/x/y.png mit Ganzzahlen, nichts anderes erreicht den Kartendienst
    location ~ ^/tiles/(\d+)/(\d+)/(\d+)\.png$ {
        limit_except GET HEAD { deny all; }
        limit_req zone=tiles burst=40 nodelay;

        # Pfad für den Kartendienst umschreiben (/tiles/z/x/y.png wird /z/x/y.png). In einem Regex-Location darf proxy_pass keinen
        # URI-Teil haben; mit rewrite … break und ohne URI-Teil geht der umgeschriebene Pfad an den Kartendienst.
        rewrite ^/tiles/(.*)$ /$1 break;
        proxy_pass https://tile.openstreetmap.org;
        proxy_ssl_server_name on;

        # Eindeutige Kennung der App statt der Daten des Besuchers (Pflicht der Tile Usage Policy)
        proxy_set_header User-Agent "Hallenkarte-Nordhain/1.0 (+https://beispiel.example/kontakt)";
        proxy_set_header Referer "https://beispiel.example/";
        proxy_set_header Cookie "";

        # Zwischenspeicher: Cache-Control des Kartendienstes gilt vorrangig; proxy_cache_valid greift nur, wenn er nichts angibt
        proxy_cache osm_tiles;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        add_header X-Cache-Status $upstream_cache_status;
    }
}
