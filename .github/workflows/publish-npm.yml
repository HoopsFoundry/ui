name: Publish to npm

# Veröffentlicht @hoopsfoundry/ui auf npm per Trusted Publishing (OIDC, kein Token).
# Voraussetzung bei npm: Trusted Publisher für dieses Paket mit Organisation HoopsFoundry, Repository ui,
# Workflow-Datei `publish-npm.yml` (Dateiname muss exakt stimmen).
# Läuft beim Push eines Tags `v*`; zum Wiederholen manuell starten, dabei den Tag als Ref wählen.
# Der Tag muss zur Version in package.json passen.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Prüfen und veröffentlichen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing braucht npm 11.5.1 oder neuer; das npm von Node 22 ist älter.
      - name: npm aktualisieren
        run: npm install -g npm@latest

      - name: Tag und Version prüfen
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Der Lauf braucht den Tag v$version (aktuell: $REF_TYPE $REF_NAME)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Diagnose: zeigt die Angaben, die GitHub an npm schickt (nur die Nutzdaten des Tokens, nie der Token selbst).
      # Wird entfernt, sobald das Veröffentlichen funktioniert.
      - name: OIDC-Angaben anzeigen
        run: |
          set -euo pipefail
          resp="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")"
          jwt="$(printf '%s' "$resp" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).value")"
          echo "::add-mask::$jwt"
          payload="$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | node -e "const c=JSON.parse(require('fs').readFileSync(0,'utf8'));for(const k of ['iss','aud','sub','repository','repository_owner','repository_id','repository_owner_id','workflow','workflow_ref','job_workflow_ref','ref','ref_type','event_name','environment','runner_environment'])console.log(k+': '+c[k])"

      - name: Veröffentlichen
        run: npm publish --access public
