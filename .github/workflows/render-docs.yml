name: Render AsciiDoc Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**/*.adoc'
      - '.github/workflows/render-docs.yml'
      - 'Gemfile'
  pull_request:
    paths:
      - 'docs/**/*.adoc'
      - '.github/workflows/render-docs.yml'
      - 'Gemfile'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: render-docs
  cancel-in-progress: true

jobs:
  check:
    # Pull Requests: nur prüfen, ob die Includes zusammengeführt werden können (kein Commit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Flatten AsciiDoc (check only)
        run: |
          set -euo pipefail
          bundle exec asciidoctor-reducer docs/architecture/index.adoc -o "$RUNNER_TEMP/README.adoc"
          test -s "$RUNNER_TEMP/README.adoc"
          if grep -n '^include::' "$RUNNER_TEMP/README.adoc"; then
            echo "Flattened output still contains include directives."
            exit 1
          fi

  render:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Flatten AsciiDoc (resolve includes)
        run: |
          set -euo pipefail
          bundle exec asciidoctor-reducer docs/architecture/index.adoc -o docs/architecture/README.adoc

      - name: Verify flattened output
        run: |
          set -euo pipefail
          test -s docs/architecture/README.adoc
          if grep -n '^include::' docs/architecture/README.adoc; then
            echo "README.adoc still contains include directives."
            exit 1
          fi

      - name: Commit flattened README.adoc
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/README.adoc
          if git diff --cached --quiet; then
            echo "No changes to docs/architecture/README.adoc."
            exit 0
          fi
          git commit -m "chore(docs): update flattened architecture README.adoc [skip ci]"
          git push
