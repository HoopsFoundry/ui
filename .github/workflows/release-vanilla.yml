name: Release Vanilla

# Baut das Vanilla-Paket (dist/vanilla) und hängt es als Release-Anhang an (Tarball, Prüfsummen, manifest.json).
#  - Tag `v*` (z. B. v0.9.0): Prüfungen, Bau, danach wird ein GitHub-Release mit den Anhängen angelegt.
#  - Manuell (workflow_dispatch): Eingabe `version`. Mit `dry_run: true` (Standard) werden die Dateien nur als Workflow-Artefakt hochgeladen,
#    es entsteht kein Release. Nur mit `dry_run: false` und einem vorhandenen Tag `v<version>` wird veröffentlicht.
# Der Ablauf selbst (Skript scripts/release-vanilla.mjs) läuft lokal ohne Netz und ohne Git-Schreibzugriff; dieser Workflow ist erst
# bei der ersten Verwendung real erprobt (siehe docs/architecture, Kapitel 7).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne v (muss package.json entsprechen, z. B. 0.9.0)'
        required: true
        type: string
      dry_run:
        description: 'Nur prüfen und bauen, Artefakt hochladen, kein Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-vanilla-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Prüfen und bauen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Version bestimmen
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            version="${REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Ungültige Version: $version"; exit 1 ;;
          esac
          if [ "$EVENT" != "push" ] && [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "Der Lauf auf dem Tag $REF_NAME passt nicht zur Version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Release-Dateien erzeugen (Version, Prüfsummen, Manifest)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-vanilla.mjs --no-build --expect-version="$VERSION"

      - name: Als Workflow-Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: dss-vanilla-${{ steps.version.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub-Release anlegen
    # Nur bei einem Tag-Push; ein manueller Lauf veröffentlicht nur mit dry_run=false und nur, wenn er auf dem Tag v<version> läuft
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref_type == 'tag')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release-Dateien laden
        uses: actions/download-artifact@v8
        with:
          name: dss-vanilla-${{ needs.build.outputs.version }}
          path: release

      - name: Release anlegen oder ergänzen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          files: |
            release/dss-vanilla-${{ needs.build.outputs.version }}.tgz
            release/dss-vanilla-${{ needs.build.outputs.version }}.sha256
            release/manifest.json
          fail_on_unmatched_files: true
